<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='9 11 12 14 22 4'></polyline><path d='M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11'></path></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern, responsive Task Tracker application built with React, Tailwind CSS, and browser LocalStorage." />
    <title>Task Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <!-- Friendly fallback warning if the user attempts to open index.html directly from Windows file explorer -->
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var rootEl = document.getElementById('root');
            if (rootEl && rootEl.children.length === 0) {
              rootEl.innerHTML = `
                <div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; max-width: 540px; margin: 60px auto; padding: 32px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; border: 1px solid #e2e8f0;">
                  <div style="font-size: 38px; margin-bottom: 12px;">⚠️</div>
                  <h2 style="color: #0f172a; font-size: 19px; font-weight: 700; margin-bottom: 8px;">Development Server Required</h2>
                  <p style="color: #64748b; font-size: 13px; line-height: 1.6; margin-bottom: 20px;">
                    Modern React applications cannot be loaded directly via <code>file:///</code> due to browser module security policies. Please launch the local development server:
                  </p>
                  <div style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 14px 18px; border-radius: 12px; text-align: left; font-family: Consolas, monospace; font-size: 13px; color: #1e293b; line-height: 1.8; margin-bottom: 16px;">
                    <div>1. Open terminal in <strong>Task5</strong> folder</div>
                    <div>2. Run: <strong style="color: #4f46e5;">npm run dev</strong></div>
                    <div>3. Open: <strong style="color: #4f46e5;">http://localhost:5173</strong></div>
                  </div>
                </div>
              `;
            }
          }, 300);
        });
      }
    </script>

    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
        <h2>JavaScript is Required</h2>
        <p>Please enable JavaScript in your browser to run this application.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
